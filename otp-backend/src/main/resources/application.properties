spring.application.name=otp-backend
server.port=8080

# OTP delivery (email only): email | log
# email = REAL send via SMTP. Falls back to log if credentials missing.
app.otp.delivery-mode=email
# IMPORTANT (Gmail rule): From must equal the authenticated Gmail, so default to MAIL_USERNAME.
# Set MAIL_FROM only if you use a custom SMTP / domain with permission to send-as.
app.otp.email-from=${MAIL_FROM:${MAIL_USERNAME:no-reply@example.com}}

# --- Real Email via Gmail SMTP (set env vars, restart) ---
# PowerShell: $env:MAIL_USERNAME="you@gmail.com"; $env:MAIL_PASSWORD="xxxx-xxxx-xxxx-xxxx"
# Gmail needs an App Password (Google Account -> Security -> 2-Step Verification -> App passwords).
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

# TEST MODE (no login needed): when true and Email NOT sent, API returns {"testOtp":"123456"}.
# UI displays it for copy-paste testing. Set false in production!
app.otp.expose-for-testing=true
